name: "Windows 11 RDP"

# Main workflow for the Windows 11 RDP setup.
#
# Entry points:
#   - workflow_dispatch -> choose ngrok or tailscale
#   - push to main -> ngrok (default)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      method:
        description: "Tunneling method"
        required: true
        default: "ngrok"
        type: choice
        options:
          - ngrok
          - tailscale

env:
  RDP_USER: runneradmin
  RDP_PASS: ${{ secrets.PASSWORD || 'P@ssw0rd123!' }}
  NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
  TAILSCALE_AUTH_KEY: ${{ secrets.TAILSCALE_AUTH_KEY }}

jobs:
  rdp:
    name: "Windows 11 RDP"
    runs-on: windows-11
    timeout-minutes: 9999

    steps:
      - name: "Enable Windows Remote Desktop"
        shell: pwsh
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' -Value 0
          net user "$Env:RDP_USER" "$Env:RDP_PASS" | Out-Null
          Write-Host "RDP listener enabled; credentials configured."

      - name: "Install ngrok"
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.method == 'ngrok') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          Invoke-WebRequest -Uri https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive -Path ngrok.zip -DestinationPath ngrok
          Remove-Item ngrok.zip
          .\ngrok\ngrok.exe version
          .\ngrok\ngrok.exe authtoken "$Env:NGROK_AUTH_TOKEN"

      - name: "Start ngrok TCP tunnel"
        if: (github.event_name == 'workflow_dispatch' && github.event.inputs.method == 'ngrok') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: |
          .\ngrok\ngrok.exe tcp 3389 --region us --log=stdout

      - name: "Start Tailscale"
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.method == 'tailscale'
        uses: tailscale/tailscale-action@v3
        with:
          authKey: ${{ env.TAILSCALE_AUTH_KEY }}
          ephemeral: true
          ssh: true

      - name: "Print RDP connection info"
        shell: pwsh
        run: |
          $infoPath = "$env:USERPROFILE\rdp-info.txt"
          @(
            '=== RDP CONNECTION INFO ==='
            "username: $Env:RDP_USER"
            "password: $Env:RDP_PASS"
          ) | Set-Content -Path $infoPath -Encoding UTF8
          Write-Host "RDP info written to $infoPath"
